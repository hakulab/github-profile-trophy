name = "github-profile-trophy"
main = "src/worker.ts"
compatibility_date = "2025-07-29"

routes = [{ pattern = "github-profile-trophy.hakula.xyz", custom_domain = true }]

[vars]
GITHUB_API = "https://api.github.com/graphql"
# Optional comma-separated default additional repository owners when the
# `repo-owners` query parameter is omitted (e.g., "org-a,org-b").
# DEFAULT_REPO_OWNERS = ""

# Set via `wrangler secret put`:
# GITHUB_TOKEN1 - Primary GitHub personal access token for GraphQL API
# GITHUB_TOKEN2 - Optional secondary GitHub personal access token for rotation

[observability.logs]
enabled = true

[placement]
mode = "smart"
